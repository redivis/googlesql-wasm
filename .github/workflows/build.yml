# Builds googlesql.wasm on every push and pull request, and attaches it to a GitHub release for tags like v1.2.3.
# The Bazel disk and repository caches are kept between runs, so only a googlesql bump is a cold build.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # To create the release

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7

      - uses: bazel-contrib/setup-bazel@0.19.1
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      # For ICU's configure
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends autoconf automake libtool m4

      - name: Build
        run: scripts/bazel-build.sh out

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Smoke test
        run: node test/smoke.mjs out

      # The npm package: generated protobuf code, the wasm, and the loader. Its version must match a release's tag.
      - name: Package
        run: scripts/package.sh out

      - name: Check the package version against the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(node -p "require('./js/package.json').version")
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "js/package.json is version $version, but the tag is ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: googlesql-wasm
          path: |
            out/googlesql.wasm
            out/schemas.tar.gz
            out/SHA256SUMS
            out/redivis-googlesql-*.tgz

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            out/googlesql.wasm
            out/schemas.tar.gz
            out/SHA256SUMS
            out/redivis-googlesql-*.tgz
          generate_release_notes: true
